spring.application.name=security

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:securitydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Encryptie sleutels (POC only - in productie via Elytron/Vault)
# KEK: passphrase, wordt omgezet naar 32-byte sleutel via SHA-256
encryption.kek=DitIsEenDemoKEKPassphrasAlleenVoorPOC
# HMAC sleutel: apart van KEK (cryptografische scheiding)
encryption.hmac-secret=DitIsEenDemoHMACSecretAlleenVoorPOC

# RFC 9457 problem+json voor Spring MVC fouten
spring.mvc.problemdetails.enabled=true
